AWSTemplateFormatVersion: "2010-09-09"
Description: >
  S3 bucket and DynamoDB table for Terraform state management
Resources:
  TerraformS3:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub devops-challenge-${AWS::AccountId}-${AWS::Region}-tfstate
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: "Enabled"
      Tags:
        - Key: "project"
          Value: "devops-challenge"

  TerraformS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformS3
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - "s3:*"
            Effect: Deny
            Resource:
              - !GetAtt TerraformS3.Arn
              - !Sub ${TerraformS3.Arn}/*
            Principal: '*'
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  DynamoDbTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub devops-challenge-${AWS::AccountId}-${AWS::Region}-lock-table
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: "project"
          Value: "devops-challenge"

Outputs:
  TerraformS3Bucket:
    Description: S3 bucket for Terraform state
    Value: !Ref TerraformS3
    Export:
      Name: TerraformS3Bucket
      
  DynamoDbLockTable:
    Description: DynamoDB table for Terraform state locking
    Value: !Ref DynamoDbTable
    Export:
      Name: DynamoDbLockTable