name: Sandbox Terraform Plan

on:
  push:
    branches:
      - "feature/**"

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=fincra3-${{ secrets.AWS_ACCOUNT_ID }}-eu-north-1-tfstate" \
            -backend-config="dynamodb_table=fincra3-${{ secrets.AWS_ACCOUNT_ID }}-eu-north-1-lock-table" \
            -backend-config="key=sandbox.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="environment/sandbox.tfvars"
