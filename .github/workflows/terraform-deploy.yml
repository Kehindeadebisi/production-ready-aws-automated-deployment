name: Deploy Full Infrastructure

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
          - dev
          - staging
          - prod

jobs:
  deploy-vpc:
    name: Deploy VPC
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy VPC
        uses: ./.github/actions/terraform-runs
        with:
          terraform_version: "~1.7.0"
          tfstate_file: vpc/terraform.tfstate
          tf_working_dir: vpc
          aws_oidc_role: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          terraform_action: ${{ github.event.inputs.terraform_action }}
          environment: ${{ github.event.inputs.environment }}
          account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION || 'us-east-1' }}

  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: deploy-vpc
    if: success()
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Infrastructure
        uses: ./.github/actions/terraform-runs
        with:
          terraform_version: "~1.7.0"
          tfstate_file: infra/terraform.tfstate
          tf_working_dir: infra
          aws_oidc_role: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          terraform_action: ${{ github.event.inputs.terraform_action }}
          environment: ${{ github.event.inputs.environment }}
          account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION || 'us-east-1' }}